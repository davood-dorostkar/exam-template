---
prometheus_version: "2.54.1"
prometheus_port: 9090
prometheus_user: prometheus
prometheus_group: prometheus
prometheus_install_dir: /opt/prometheus
prometheus_data_dir: /var/lib/prometheus
prometheus_architecture_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
prometheus_architecture: "{{ prometheus_architecture_map[ansible_architecture] | default(ansible_architecture) }}"
prometheus_download_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_architecture }}.tar.gz"
prometheus_node_exporter_target: "127.0.0.1:{{ node_exporter_port | default(9100) }}"
