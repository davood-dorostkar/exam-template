---
node_exporter_version: "1.8.2"
node_exporter_port: 9100
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_install_dir: /opt/node_exporter
node_exporter_architecture_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
node_exporter_architecture: "{{ node_exporter_architecture_map[ansible_architecture] | default(ansible_architecture) }}"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}.tar.gz"
